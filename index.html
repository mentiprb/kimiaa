<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chemistry Bonding Lab — Pembelajaran Ikatan Kimia</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --sky: #a8d8f0; --sky-light: #d4ecfa; --pastel-blue: #b8dff5;
  --pastel-yellow: #ffe9a8; --yellow-accent: #ffd54f;
  --navy: #0f2847; --navy-soft: #1a3a5c; --gold: #e0a800;
  --white: #ffffff; --text: #14304d; --text-dim: #5a7894;
  --shadow-sm: 0 2px 10px rgba(15,40,71,0.08);
  --shadow-md: 0 8px 30px rgba(15,40,71,0.15);
  --shadow-lg: 0 20px 60px rgba(15,40,71,0.2);
  --glass: rgba(255,255,255,0.7); --glass-border: rgba(255,255,255,0.85);
}
html, body {
  height: 100%; font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
  color: var(--text); overflow-x: hidden;
  background: linear-gradient(135deg, #eaf6fd 0%, #f7fbfe 40%, #fff8e0 100%);
  background-attachment: fixed;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background:
    radial-gradient(circle at 15% 25%, rgba(168,216,240,0.4) 0%, transparent 45%),
    radial-gradient(circle at 85% 75%, rgba(255,233,168,0.35) 0%, transparent 45%);
  pointer-events: none; z-index: 0;
}
.app { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 20px; min-height: 100vh; }

/* NAVBAR */
.navbar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 22px; background: var(--glass);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border: 1px solid var(--glass-border); border-radius: 18px;
  box-shadow: var(--shadow-md); margin-bottom: 22px;
  position: sticky; top: 14px; z-index: 50; flex-wrap: wrap; gap: 12px;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.1rem; color: var(--navy); }
.brand .logo { width: 38px; height: 38px; background: linear-gradient(135deg, var(--sky), var(--yellow-accent)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; box-shadow: 0 4px 12px rgba(168,216,240,0.6); }
.nav-links { display: flex; gap: 6px; flex-wrap: wrap; }
.nav-links button {
  background: transparent; border: none; padding: 10px 16px; border-radius: 10px;
  font-size: 0.9rem; font-weight: 700; color: var(--text-dim); cursor: pointer;
  transition: all 0.2s; font-family: inherit;
}
.nav-links button:hover { color: var(--navy); background: rgba(168,216,240,0.25); }
.nav-links button.active { color: var(--white); background: linear-gradient(135deg, var(--navy), var(--navy-soft)); box-shadow: 0 4px 14px rgba(15,40,71,0.3); }
.progress-badge { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; font-weight: 700; color: var(--navy); background: rgba(255,213,79,0.35); padding: 8px 14px; border-radius: 20px; border: 1px solid rgba(224,168,0,0.3); }
.progress-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px var(--gold); }

.page { display: none; animation: fadeIn 0.4s ease; }
.page.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

/* HERO */
.hero {
  position: relative;
  background: linear-gradient(135deg, rgba(255,255,255,0.85), rgba(212,236,250,0.75));
  backdrop-filter: blur(20px); border: 1px solid var(--glass-border);
  border-radius: 28px; padding: 60px 30px; box-shadow: var(--shadow-lg);
  overflow: hidden; text-align: center;
}
.hero-canvas { position: absolute; inset: 0; z-index: 0; opacity: 0.85; }
.hero-content { position: relative; z-index: 2; }
.hero h1 { font-size: clamp(1.8rem, 5vw, 3.2rem); font-weight: 900; line-height: 1.15; margin-bottom: 12px; background: linear-gradient(135deg, var(--navy), #2a6ca0, var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: -0.5px; }
.hero h2 { font-size: clamp(1.1rem, 2.5vw, 1.6rem); font-weight: 700; color: var(--navy-soft); margin-bottom: 20px; }
.hero p.lead { font-size: clamp(0.95rem, 1.8vw, 1.1rem); color: var(--text-dim); max-width: 680px; margin: 0 auto 30px; line-height: 1.75; }
.hero-actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }

.btn { display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; border-radius: 14px; font-size: 1rem; font-weight: 800; letter-spacing: 0.4px; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; font-family: inherit; }
.btn-lg { padding: 16px 34px; font-size: 1.05rem; }
.btn-primary { background: linear-gradient(135deg, var(--navy), var(--navy-soft)); color: white; box-shadow: 0 8px 24px rgba(15,40,71,0.35); }
.btn-primary:hover { transform: translateY(-3px); box-shadow: 0 14px 32px rgba(15,40,71,0.45); }
.btn-sky { background: linear-gradient(135deg, #7fc4e8, #5aa8d4); color: white; box-shadow: 0 8px 24px rgba(90,168,212,0.4); }
.btn-sky:hover { transform: translateY(-3px); }
.btn-gold { background: linear-gradient(135deg, var(--yellow-accent), var(--gold)); color: var(--navy); box-shadow: 0 8px 24px rgba(224,168,0,0.4); }
.btn-gold:hover { transform: translateY(-3px); }
.btn-outline { background: rgba(255,255,255,0.7); color: var(--navy); border-color: rgba(15,40,71,0.2); }
.btn-outline:hover { background: white; border-color: var(--navy); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

.tagline { margin-top: 30px; font-size: 0.95rem; font-weight: 800; letter-spacing: 1.5px; color: var(--navy-soft); text-transform: uppercase; }
.hero-features { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-top: 36px; position: relative; z-index: 2; }
.feature { background: rgba(255,255,255,0.75); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); border-radius: 18px; padding: 22px 18px; box-shadow: var(--shadow-sm); transition: all 0.25s; }
.feature:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
.feature .icon { font-size: 2rem; margin-bottom: 10px; }
.feature h3 { font-size: 1rem; color: var(--navy); margin-bottom: 6px; }
.feature p { font-size: 0.85rem; color: var(--text-dim); line-height: 1.6; }

/* MATERI */
.materi-layout { display: grid; grid-template-columns: 240px 1fr; gap: 20px; }
@media (max-width: 820px) { .materi-layout { grid-template-columns: 1fr; } }
.materi-tabs { display: flex; flex-direction: column; gap: 8px; background: rgba(255,255,255,0.7); border-radius: 18px; padding: 14px; border: 1px solid var(--glass-border); box-shadow: var(--shadow-sm); height: fit-content; position: sticky; top: 90px; }
.materi-tabs button { text-align: left; padding: 12px 14px; border: none; background: transparent; border-radius: 10px; font-family: inherit; font-size: 0.88rem; font-weight: 700; color: var(--text-dim); cursor: pointer; transition: all 0.18s; line-height: 1.4; }
.materi-tabs button:hover { background: rgba(168,216,240,0.25); color: var(--navy); }
.materi-tabs button.active { background: linear-gradient(135deg, var(--navy), var(--navy-soft)); color: white; }
.materi-tabs button .num { display: inline-block; width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 6px; background: rgba(168,216,240,0.4); color: var(--navy); font-size: 0.78rem; margin-right: 8px; }
.materi-tabs button.active .num { background: rgba(255,213,79,0.6); }

.materi-content { background: rgba(255,255,255,0.85); backdrop-filter: blur(18px); border: 1px solid var(--glass-border); border-radius: 22px; padding: 30px; box-shadow: var(--shadow-md); min-height: 500px; }
.materi-content h2 { color: var(--navy); font-size: 1.5rem; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 2px dashed rgba(168,216,240,0.7); }
.materi-content h3 { color: var(--navy-soft); margin: 20px 0 8px; font-size: 1.1rem; }
.materi-content p { color: var(--text); line-height: 1.75; margin-bottom: 12px; font-size: 0.97rem; }
.materi-content ul, .materi-content ol { padding-left: 24px; margin-bottom: 14px; }
.materi-content li { color: var(--text); line-height: 1.75; margin-bottom: 6px; font-size: 0.96rem; }
.materi-content strong { color: var(--navy); }

.materi-visual { background: linear-gradient(135deg, #eaf6fd, #fff8e0); border-radius: 16px; padding: 22px; margin: 18px 0; border: 1px solid rgba(168,216,240,0.5); text-align: center; }
.materi-visual canvas { display: block; margin: 0 auto; max-width: 100%; }
.materi-visual .caption { font-size: 0.85rem; color: var(--text-dim); margin-top: 12px; font-style: italic; }

.contoh-soal { background: rgba(255,233,168,0.35); border-left: 5px solid var(--yellow-accent); border-radius: 12px; padding: 18px 20px; margin: 16px 0; }
.contoh-soal .label { display: inline-block; background: var(--yellow-accent); color: var(--navy); font-weight: 800; font-size: 0.75rem; padding: 4px 10px; border-radius: 6px; margin-bottom: 10px; }
.contoh-soal .jawaban { background: rgba(255,255,255,0.7); border-radius: 10px; padding: 12px 14px; margin-top: 10px; font-size: 0.92rem; display: none; }
.contoh-soal .jawaban.show { display: block; }
.contoh-soal button { background: var(--navy); color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 700; font-size: 0.85rem; cursor: pointer; font-family: inherit; margin-top: 8px; }
.contoh-soal button:hover { background: var(--navy-soft); }

/* LAB */
.lab-layout { display: grid; grid-template-columns: 280px 1fr; gap: 20px; }
@media (max-width: 900px) { .lab-layout { grid-template-columns: 1fr; } }
.lab-panel { background: rgba(255,255,255,0.85); backdrop-filter: blur(18px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px; box-shadow: var(--shadow-md); }
.atom-palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.atom-btn { aspect-ratio: 1; border-radius: 50%; border: 2px solid rgba(15,40,71,0.15); font-weight: 800; font-size: 0.85rem; cursor: pointer; transition: all 0.18s; font-family: inherit; color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.3); box-shadow: inset -3px -3px 8px rgba(0,0,0,0.2), inset 3px 3px 8px rgba(255,255,255,0.4); }
.atom-btn:hover { transform: scale(1.1); }
.atom-btn.selected { transform: scale(1.15); border-color: var(--gold); border-width: 3px; box-shadow: 0 0 20px rgba(255,213,79,0.8); }

.lab-canvas-wrap { background: linear-gradient(135deg, #0f2847, #1a3a5c); border-radius: 20px; overflow: hidden; position: relative; min-height: 460px; border: 1px solid var(--glass-border); box-shadow: var(--shadow-md); }
#labCanvas { display: block; width: 100%; height: 460px; cursor: crosshair; }
.lab-hint { position: absolute; top: 14px; left: 14px; background: rgba(255,255,255,0.9); padding: 8px 14px; border-radius: 10px; font-size: 0.8rem; font-weight: 700; color: var(--navy); pointer-events: none; }
.lab-info-panel { position: absolute; top: 14px; right: 14px; width: 260px; max-height: calc(100% - 28px); overflow-y: auto; background: rgba(255,255,255,0.95); border-radius: 14px; padding: 14px; font-size: 0.82rem; color: var(--navy); box-shadow: var(--shadow-md); display: none; }
.lab-info-panel.show { display: block; }
.lab-info-panel h4 { font-size: 1rem; margin-bottom: 8px; }
.lab-info-panel .row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed rgba(15,40,71,0.1); }
.lab-info-panel .row span:first-child { color: var(--text-dim); font-weight: 600; }
.lab-info-panel .row span:last-child { font-weight: 700; text-align: right; max-width: 60%; }
.lab-info-panel .explain { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(15,40,71,0.15); line-height: 1.55; font-size: 0.8rem; }

.lab-controls { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.lab-controls button { padding: 11px 14px; border-radius: 10px; border: 2px solid rgba(15,40,71,0.15); background: white; font-family: inherit; font-weight: 700; font-size: 0.85rem; cursor: pointer; color: var(--navy); text-align: left; }
.lab-controls button:hover { border-color: var(--navy); background: var(--sky-light); }
.lab-controls button.danger { border-color: #e57373; color: #c62828; }
.lab-controls button.danger:hover { background: #ffebee; }
.lab-controls button.primary { background: var(--navy); color: white; border-color: var(--navy); }
.lab-controls button.primary:hover { background: var(--navy-soft); }

/* KUIS */
.quiz-arena { display: grid; grid-template-columns: 1fr auto 1fr; gap: 20px; align-items: center; margin-bottom: 22px; }
@media (max-width: 700px) { .quiz-arena { grid-template-columns: 1fr; } .vs-badge { transform: rotate(90deg); } }
.fighter { text-align: center; padding: 18px; background: rgba(255,255,255,0.85); backdrop-filter: blur(14px); border-radius: 20px; border: 3px solid transparent; transition: all 0.3s; box-shadow: var(--shadow-md); }
.fighter.team-blue { border-color: #5aa8d4; }
.fighter.team-yellow { border-color: var(--yellow-accent); }
.fighter.active-turn { transform: scale(1.03); box-shadow: 0 0 0 4px rgba(255,213,79,0.5), var(--shadow-lg); }
.fighter .avatar { font-size: 3rem; margin-bottom: 6px; display: inline-block; }
.fighter.attack .avatar { animation: attackAnim 0.6s; }
.fighter.hit .avatar { animation: hitAnim 0.5s; }
@keyframes attackAnim { 0%,100%{transform:translateX(0) scale(1)} 50%{transform:translateX(18px) scale(1.15)} }
@keyframes hitAnim { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-12px) rotate(-8deg)} 75%{transform:translateX(12px) rotate(8deg)} }
.fighter .name { font-weight: 800; font-size: 1rem; margin-bottom: 10px; }
.team-blue .name { color: #1a6ba0; }
.team-yellow .name { color: var(--gold); }
.hp-bar { height: 18px; background: rgba(15,40,71,0.15); border-radius: 10px; overflow: hidden; border: 2px solid rgba(15,40,71,0.1); }
.hp-fill { height: 100%; width: 100%; transition: width 0.6s ease; border-radius: 8px; }
.team-blue .hp-fill { background: linear-gradient(90deg, #7fc4e8, #2a7bb0); }
.team-yellow .hp-fill { background: linear-gradient(90deg, #ffe082, #e0a800); }
.hp-text { font-size: 0.78rem; margin-top: 6px; color: var(--text-dim); font-weight: 700; }

.vs-badge { font-size: 1.8rem; font-weight: 900; color: var(--navy); background: var(--yellow-accent); padding: 10px 16px; border-radius: 50%; box-shadow: 0 6px 20px rgba(224,168,0,0.5); animation: pulseVs 1.6s infinite; }
@keyframes pulseVs { 0%,100%{transform:scale(1)} 50%{transform:scale(1.12)} }

.tug-canvas-wrap { background: linear-gradient(135deg, #eaf6fd, #fff8e0); border-radius: 18px; padding: 12px; border: 1px solid var(--glass-border); box-shadow: var(--shadow-md); margin-bottom: 20px; text-align: center; }
#tugCanvas { display: block; margin: 0 auto; max-width: 100%; }

.quiz-panel { background: rgba(255,255,255,0.9); backdrop-filter: blur(18px); border: 1px solid var(--glass-border); border-radius: 22px; padding: 26px; box-shadow: var(--shadow-md); }
.quiz-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
.quiz-meta { display: flex; gap: 14px; align-items: center; font-weight: 700; font-size: 0.85rem; color: var(--text-dim); flex-wrap: wrap; }
.quiz-meta .q-num { background: var(--navy); color: white; padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; }
.quiz-meta .timer { font-family: 'Courier New', monospace; font-size: 1.2rem; color: var(--navy); background: rgba(255,213,79,0.4); padding: 6px 14px; border-radius: 8px; }
.quiz-meta .timer.danger { color: #c62828; background: rgba(229,115,115,0.25); animation: blink 0.6s infinite; }
@keyframes blink { 50% { opacity: 0.4; } }

.quiz-question { font-size: 1.15rem; font-weight: 700; color: var(--navy); line-height: 1.55; margin-bottom: 20px; padding: 16px; background: rgba(168,216,240,0.2); border-radius: 12px; border-left: 5px solid var(--sky); }
.quiz-options { display: grid; gap: 10px; }
.quiz-option { display: flex; align-items: center; gap: 14px; padding: 14px 18px; background: white; border: 2px solid rgba(15,40,71,0.12); border-radius: 12px; cursor: pointer; font-size: 0.95rem; color: var(--navy); text-align: left; width: 100%; font-family: inherit; transition: all 0.15s; font-weight: 600; }
.quiz-option:hover:not(:disabled) { border-color: var(--navy); background: var(--sky-light); transform: translateX(4px); }
.quiz-option .letter { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: var(--sky-light); color: var(--navy); border-radius: 8px; font-weight: 800; flex-shrink: 0; }
.quiz-option.correct { border-color: #2e7d32; background: #e8f5e9; }
.quiz-option.correct .letter { background: #2e7d32; color: white; }
.quiz-option.wrong { border-color: #c62828; background: #ffebee; }
.quiz-option.wrong .letter { background: #c62828; color: white; }
.quiz-option:disabled { cursor: default; }

.feedback-box { margin-top: 16px; padding: 14px 18px; border-radius: 12px; font-weight: 700; display: none; font-size: 0.92rem; line-height: 1.55; }
.feedback-box.show { display: block; }
.feedback-box.ok { background: #e8f5e9; color: #1b5e20; border-left: 4px solid #2e7d32; }
.feedback-box.no { background: #ffebee; color: #b71c1c; border-left: 4px solid #c62828; }

.quiz-next-btn { margin-top: 16px; padding: 12px 28px; background: var(--navy); color: white; border: none; border-radius: 12px; font-weight: 800; font-size: 0.95rem; cursor: pointer; font-family: inherit; display: none; }
.quiz-next-btn.show { display: inline-block; }
.quiz-next-btn:hover { background: var(--navy-soft); }

/* MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(15,40,71,0.6); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
.modal-overlay.show { display: flex; }
.modal { background: white; border-radius: 24px; padding: 32px; max-width: 500px; width: 100%; box-shadow: var(--shadow-lg); text-align: center; }
.modal h3 { font-size: 1.5rem; color: var(--navy); margin-bottom: 10px; }
.modal p { color: var(--text-dim); margin-bottom: 24px; line-height: 1.6; }
.modal-actions { display: flex; flex-direction: column; gap: 12px; }

/* RESULT */
.result-screen { text-align: center; padding: 40px 24px; }
.result-screen .trophy { font-size: 5rem; margin-bottom: 12px; animation: bounce 1s infinite; }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
.result-screen h2 { font-size: 1.9rem; color: var(--navy); margin-bottom: 8px; }
.result-screen .final-score { font-size: 4rem; font-weight: 900; margin: 18px 0; background: linear-gradient(135deg, var(--navy), var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.result-screen .kategori { display: inline-block; padding: 10px 24px; border-radius: 30px; font-weight: 800; font-size: 1rem; margin-bottom: 20px; }
.kategori.emas { background: linear-gradient(135deg, #ffd54f, #e0a800); color: var(--navy); }
.kategori.perak { background: linear-gradient(135deg, #cfd8dc, #90a4ae); color: white; }
.kategori.perunggu { background: linear-gradient(135deg, #ffcc80, #ef6c00); color: white; }
.kategori.belajar { background: linear-gradient(135deg, #90caf9, #1976d2); color: white; }
.result-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; max-width: 560px; margin: 0 auto 26px; }
.stat-box { background: rgba(255,255,255,0.8); border-radius: 14px; padding: 14px; border: 1px solid rgba(15,40,71,0.1); }
.stat-box .val { font-size: 1.5rem; font-weight: 900; color: var(--navy); }
.stat-box .lbl { font-size: 0.78rem; color: var(--text-dim); font-weight: 700; margin-top: 2px; }
.pembahasan { text-align: left; max-width: 720px; margin: 0 auto; background: rgba(255,255,255,0.85); border-radius: 18px; padding: 24px; box-shadow: var(--shadow-sm); max-height: 420px; overflow-y: auto; }
.pembahasan h3 { color: var(--navy); margin-bottom: 14px; font-size: 1.1rem; }
.pembahasan .item { padding: 12px 0; border-bottom: 1px dashed rgba(15,40,71,0.1); font-size: 0.88rem; line-height: 1.6; }
.pembahasan .item:last-child { border-bottom: none; }
.pembahasan .item .q { font-weight: 700; color: var(--navy); margin-bottom: 4px; }
.pembahasan .item .ans { font-size: 0.85rem; }
.pembahasan .item .ans.benar { color: #2e7d32; }
.pembahasan .item .ans.salah { color: #c62828; }

.result-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 26px; }

/* MUSIC */
.music-toggle { position: fixed; bottom: 20px; right: 20px; width: 56px; height: 56px; border-radius: 50%; background: white; border: 2px solid var(--navy); color: var(--navy); font-size: 1.5rem; cursor: pointer; z-index: 100; box-shadow: var(--shadow-md); transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
.music-toggle:hover { transform: scale(1.1); }
.music-toggle.playing { background: var(--navy); color: var(--yellow-accent); animation: pulseMusic 2s infinite; }
@keyframes pulseMusic { 0%,100%{box-shadow:0 0 0 0 rgba(15,40,71,0.5)} 50%{box-shadow:0 0 0 12px rgba(15,40,71,0)} }
